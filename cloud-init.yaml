#cloud-config

package_update: true
package_upgrade: false

timezone: America/Toronto

users:
  - name: dev
    groups:
      - sudo
    shell: /bin/bash
    sudo:
      - ALL=(ALL) NOPASSWD:ALL

packages:
  - git
  - git-lfs
  - curl
  - wget
  - unzip
  - zip
  - jq
  - build-essential
  - cmake
  - ninja-build
  - pkg-config
  - python3
  - python3-pip
  - python3-venv
  - pipx
  - nodejs
  - npm
  - openssh-server
  - tmux
  - neovim
  - ripgrep
  - fd-find
  - fzf
  - htop
  - shellcheck
  - sqlite3
  - ca-certificates
  - gnupg

write_files:
  - path: /etc/sudoers.d/dev
    permissions: "0440"
    content: |
      dev ALL=(ALL) NOPASSWD:ALL

runcmd:
  # Workspace
  - mkdir -p /home/dev/projects
  - chown -R dev:dev /home/dev

  # Docker
  - curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
  - sh /tmp/get-docker.sh
  - usermod -aG docker dev
  - systemctl enable --now docker

  # Git defaults
  - sudo -u dev git config --global init.defaultBranch main
  - sudo -u dev git config --global pull.rebase false

  # Marker used by rebuild script
  - touch /var/lib/t3-sandbox-ready
